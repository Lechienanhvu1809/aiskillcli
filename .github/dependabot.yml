version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 5
    # Gom các cập nhật nhỏ lại để không tạo quá nhiều PRs
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production
