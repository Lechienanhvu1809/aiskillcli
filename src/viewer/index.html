<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Skills Graph</title>
  <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #121212;
      color: #e0e0e0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }
    
    #header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 50px;
      background: rgba(20, 20, 20, 0.9);
      border-bottom: 1px solid #333;
      display: flex;
      align-items: center;
      padding: 0 20px;
      z-index: 10;
      box-sizing: border-box;
    }
    
    #header h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #fff;
    }

    #header .stats {
      margin-left: auto;
      font-size: 14px;
      color: #aaa;
    }

    #network {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }

    /* Vis Network styling */
    .vis-network {
      outline: none;
    }
    
    #panel {
      position: absolute;
      right: 20px;
      top: 70px;
      width: 250px;
      background: rgba(30, 30, 30, 0.85);
      border: 1px solid #444;
      border-radius: 8px;
      padding: 15px;
      z-index: 10;
      backdrop-filter: blur(10px);
    }
    
    #panel h3 {
      margin-top: 0;
      font-size: 14px;
      border-bottom: 1px solid #555;
      padding-bottom: 8px;
      color: #ddd;
    }
    
    #panel-content {
      font-size: 13px;
      color: #bbb;
      line-height: 1.5;
    }
  </style>
</head>
<body>

<div id="header">
  <h1>AI Skills Knowledge Graph</h1>
  <div class="stats" id="stats">Nodes: 0 | Edges: 0</div>
</div>

<div id="network"></div>

<div id="panel">
  <h3>Selection Info</h3>
  <div id="panel-content">Click on a skill node to view details.</div>
</div>

<script type="text/javascript">
  document.addEventListener('DOMContentLoaded', async () => {
    const container = document.getElementById('network');
    const panelContent = document.getElementById('panel-content');
    const statsDiv = document.getElementById('stats');

    try {
      const response = await fetch('/api/graph');
      const data = await fetch('/api/graph').then(res => res.json());

      const nodes = new vis.DataSet(data.nodes);
      const edges = new vis.DataSet(data.edges);

      statsDiv.textContent = `Nodes: ${nodes.length} | Edges: ${edges.length}`;

      const graphData = {
        nodes: nodes,
        edges: edges
      };

      const options = {
        nodes: {
          shape: 'box',
          margin: 10,
          font: {
            color: '#fff',
            face: 'monospace',
            size: 14
          },
          color: {
            border: '#2b7ce9',
            background: '#1b3b63',
            highlight: {
              border: '#5194ff',
              background: '#24528c'
            }
          },
          borderWidth: 1,
          shadow: true
        },
        edges: {
          color: '#555',
          arrows: {
            to: { enabled: true, scaleFactor: 0.8 }
          },
          smooth: {
            type: 'continuous'
          }
        },
        physics: {
          forceAtlas2Based: {
            gravitationalConstant: -50,
            centralGravity: 0.01,
            springLength: 100,
            springConstant: 0.08
          },
          maxVelocity: 50,
          solver: 'forceAtlas2Based',
          timestep: 0.35,
          stabilization: { iterations: 150 }
        },
        interaction: {
          hover: true,
          tooltipDelay: 200
        }
      };

      const network = new vis.Network(container, graphData, options);

      network.on("selectNode", function (params) {
        if (params.nodes.length > 0) {
          const nodeId = params.nodes[0];
          const node = nodes.get(nodeId);
          panelContent.innerHTML = `
            <strong>Name:</strong> ${node.id}<br><br>
            <strong>Description:</strong><br>
            ${node.description || 'No description available.'}<br><br>
            <strong>Tags:</strong> ${node.tags ? node.tags.join(', ') : 'None'}
          `;
        }
      });

      network.on("deselectNode", function (params) {
        panelContent.innerHTML = 'Click on a skill node to view details.';
      });

    } catch (err) {
      console.error(err);
      panelContent.innerHTML = `<span style="color: #ff5555;">Error loading graph data.</span>`;
    }
  });
</script>

</body>
</html>
