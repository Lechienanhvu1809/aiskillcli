<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Source Code Dependency Graph</title>
  <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0b0c10;
      --accent: #66fcf1;
      --accent-dim: #45a29e;
      --panel-bg: rgba(11, 12, 16, 0.75);
      --text-main: #c5c6c7;
      --text-bright: #ffffff;
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg-color);
      /* Cyber/Data-sci grid background */
      background-image: 
        linear-gradient(rgba(102, 252, 241, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(102, 252, 241, 0.05) 1px, transparent 1px);
      background-size: 30px 30px;
      background-position: center center;
      color: var(--text-main);
      font-family: 'Outfit', sans-serif;
      overflow: hidden;
    }
    
    #header {
      position: absolute;
      top: 20px;
      left: 20px;
      width: calc(100% - 40px);
      height: 60px;
      background: var(--panel-bg);
      border: 1px solid rgba(102, 252, 241, 0.2);
      border-radius: 12px;
      display: flex;
      align-items: center;
      padding: 0 25px;
      z-index: 10;
      box-sizing: border-box;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      animation: slideDown 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    #header h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--accent);
      text-shadow: 0 0 10px rgba(102, 252, 241, 0.4);
    }

    #header .stats {
      margin-left: auto;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: var(--accent-dim);
      background: rgba(69, 162, 158, 0.1);
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid rgba(69, 162, 158, 0.3);
    }

    #network {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      animation: fadeIn 1s ease-in-out;
    }

    .vis-network {
      outline: none;
    }
    
    #panel {
      position: absolute;
      right: 20px;
      top: 100px;
      width: 320px;
      background: var(--panel-bg);
      border: 1px solid rgba(102, 252, 241, 0.2);
      border-radius: 12px;
      padding: 20px;
      z-index: 10;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      transform: translateX(120%);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #panel.active {
      transform: translateX(0);
    }
    
    #panel h3 {
      margin-top: 0;
      font-size: 16px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 1px solid rgba(102, 252, 241, 0.2);
      padding-bottom: 10px;
      color: var(--text-bright);
    }
    
    #panel-content {
      font-size: 14px;
      color: var(--text-main);
      line-height: 1.6;
    }

    .prop-label {
      font-size: 11px;
      text-transform: uppercase;
      color: var(--accent-dim);
      letter-spacing: 1px;
      display: block;
      margin-top: 12px;
      margin-bottom: 4px;
    }

    .prop-value {
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-bright);
      font-size: 13px;
      word-break: break-all;
    }

    .tag-chip {
      display: inline-block;
      padding: 4px 10px;
      background: rgba(102, 252, 241, 0.1);
      border: 1px solid rgba(102, 252, 241, 0.3);
      border-radius: 4px;
      font-size: 11px;
      color: var(--accent);
      margin-right: 6px;
      margin-bottom: 6px;
    }

    @keyframes slideDown {
      from { transform: translateY(-100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Upgrades: Search & Loading */
    #search-container {
      margin-left: 20px;
      display: flex;
      align-items: center;
    }
    #search-box {
      background: rgba(11, 12, 16, 0.5);
      border: 1px solid rgba(102, 252, 241, 0.3);
      border-radius: 6px;
      color: var(--text-bright);
      padding: 6px 12px;
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      width: 200px;
      outline: none;
      transition: all 0.3s;
    }
    #search-box:focus {
      border-color: var(--accent);
      box-shadow: 0 0 8px rgba(102, 252, 241, 0.4);
    }
    
    #overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: var(--bg-color);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.5s;
    }
    #overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(102, 252, 241, 0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    #overlay-text {
      font-family: 'JetBrains Mono', monospace;
      color: var(--accent);
      letter-spacing: 1px;
    }
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
    #error-message {
      color: #ff4a4a;
      background: rgba(255, 74, 74, 0.1);
      padding: 15px 25px;
      border-radius: 8px;
      border: 1px solid rgba(255, 74, 74, 0.3);
      display: none;
    }
  </style>
</head>
<body>

<div id="overlay">
  <div class="spinner" id="spinner"></div>
  <div id="overlay-text">Initializing Graph Engine...</div>
  <div id="error-message"></div>
</div>

<div id="header">
  <h1>System Dependency Graph</h1>
  <div id="search-container">
    <input type="text" id="search-box" placeholder="Search module..." autocomplete="off">
  </div>
  <div class="stats" id="stats">Analyzing...</div>
</div>

<div id="network"></div>

<div id="panel">
  <h3>Node Inspector</h3>
  <div id="panel-content">Select a module to view telemetry.</div>
</div>

<script type="text/javascript">
  document.addEventListener('DOMContentLoaded', async () => {
    const container = document.getElementById('network');
    const panelContent = document.getElementById('panel-content');
    const statsDiv = document.getElementById('stats');
    const searchBox = document.getElementById('search-box');
    const overlay = document.getElementById('overlay');
    const spinner = document.getElementById('spinner');
    const overlayText = document.getElementById('overlay-text');
    const errorMessage = document.getElementById('error-message');

    // Cờ trạng thái
    let graphData = null;
    let network = null;
    let nodesDataSet = null;

    // --- BẢO MẬT: Hàm tạo DOM an toàn ---
    function renderPanel(node) {
      panelContent.innerHTML = ''; // Clear safe
      
      const createLabel = (text) => {
        const span = document.createElement('span');
        span.className = 'prop-label';
        span.textContent = text;
        return span;
      };
      
      const createValue = (text) => {
        const div = document.createElement('div');
        div.className = 'prop-value';
        div.textContent = text || 'Unknown';
        return div;
      };

      // Tên Module
      panelContent.appendChild(createLabel('Module ID'));
      panelContent.appendChild(createValue(node.id));

      // Đường dẫn / Mô tả
      panelContent.appendChild(createLabel('Path Info / Description'));
      panelContent.appendChild(createValue(node.description));

      // Tags
      panelContent.appendChild(createLabel('Classification'));
      const tagsContainer = document.createElement('div');
      if (node.tags && node.tags.length > 0) {
        node.tags.forEach(t => {
          const chip = document.createElement('span');
          chip.className = 'tag-chip';
          chip.textContent = t;
          tagsContainer.appendChild(chip);
        });
      } else {
        const na = document.createElement('span');
        na.className = 'prop-value dim';
        na.textContent = 'N/A';
        tagsContainer.appendChild(na);
      }
      panelContent.appendChild(tagsContainer);
    }

    try {
      const response = await fetch('/api/graph');
      if (!response.ok) {
        throw new Error(`Server returned ${response.status} ${response.statusText}`);
      }
      const data = await response.json();

      nodesDataSet = new vis.DataSet(data.nodes);
      const edges = new vis.DataSet(data.edges);

      statsDiv.textContent = `Nodes: ${nodesDataSet.length} | Edges: ${edges.length}`;

      graphData = {
        nodes: nodesDataSet,
        edges: edges
      };

      const options = {
        nodes: {
          shape: 'dot',
          size: 16,
          font: {
            color: '#c5c6c7',
            face: '"JetBrains Mono", monospace',
            size: 12,
            vadjust: -30,
            strokeWidth: 4,
            strokeColor: '#0b0c10'
          },
          color: {
            border: '#45a29e',
            background: 'rgba(11, 12, 16, 0.8)',
            highlight: {
              border: '#66fcf1',
              background: 'rgba(102, 252, 241, 0.2)'
            },
            hover: {
              border: '#66fcf1',
              background: 'rgba(102, 252, 241, 0.1)'
            }
          },
          borderWidth: 2,
          borderWidthSelected: 3,
          shadow: {
            enabled: true,
            color: 'rgba(102, 252, 241, 0.3)',
            size: 15,
            x: 0,
            y: 0
          }
        },
        edges: {
          color: {
            color: 'rgba(69, 162, 158, 0.4)',
            highlight: '#66fcf1',
            hover: '#45a29e'
          },
          width: 1.5,
          selectionWidth: 3,
          arrows: {
            to: { enabled: true, scaleFactor: 0.5, type: 'arrow' }
          },
          smooth: {
            type: 'cubicBezier',
            forceDirection: 'none',
            roundness: 0.4
          }
        },
        physics: {
          forceAtlas2Based: {
            gravitationalConstant: -100,
            centralGravity: 0.005,
            springLength: 150,
            springConstant: 0.04,
            damping: 0.09
          },
          maxVelocity: 40,
          solver: 'forceAtlas2Based',
          timestep: 0.3,
          stabilization: { 
            enabled: true,
            iterations: 200,
            updateInterval: 25
          }
        },
        interaction: {
          hover: true,
          tooltipDelay: 200,
          hideEdgesOnDrag: true,
          hideEdgesOnZoom: true
        }
      };

      network = new vis.Network(container, graphData, options);

      // --- HIỆU NĂNG: Đóng băng vật lý sau khi ổn định ---
      network.on("stabilizationIterationsDone", function () {
        network.setOptions({ physics: { enabled: false } });
        // Tắt màn hình loading
        overlay.classList.add('hidden');
      });

      // Bật lại vật lý khi kéo
      network.on("dragStart", function (params) {
        if (params.nodes.length > 0) {
          network.setOptions({ physics: { enabled: true } });
        }
      });
      network.on("dragEnd", function (params) {
        if (params.nodes.length > 0) {
          // Cho physics chạy thêm một chút rồi tắt để không tốn CPU
          setTimeout(() => {
             network.setOptions({ physics: { enabled: false } });
          }, 2000);
        }
      });

      network.on("selectNode", function (params) {
        if (params.nodes.length > 0) {
          const nodeId = params.nodes[0];
          const node = nodesDataSet.get(nodeId);
          renderPanel(node);
          document.getElementById('panel').classList.add('active');
        }
      });

      network.on("deselectNode", function (params) {
        document.getElementById('panel').classList.remove('active');
      });

      // --- TƯƠNG TÁC: Xử lý Tìm kiếm (Search) ---
      searchBox.addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase();
        if (!query) {
          network.unselectAll();
          document.getElementById('panel').classList.remove('active');
          return;
        }

        const allNodes = nodesDataSet.get();
        const matched = allNodes.filter(n => 
          n.id.toLowerCase().includes(query) || 
          (n.tags && n.tags.some(t => t.toLowerCase().includes(query)))
        );

        if (matched.length > 0) {
          // Focus vào Node đầu tiên tìm được
          const targetId = matched[0].id;
          network.selectNodes([targetId]);
          network.focus(targetId, {
            scale: 1.2,
            animation: {
              duration: 500,
              easingFunction: 'easeInOutQuad'
            }
          });
          renderPanel(matched[0]);
          document.getElementById('panel').classList.add('active');
        } else {
          network.unselectAll();
          document.getElementById('panel').classList.remove('active');
        }
      });

      // --- TƯƠNG TÁC: Phím Escape để thoát ---
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          network.unselectAll();
          document.getElementById('panel').classList.remove('active');
          searchBox.blur();
        }
      });

    } catch (err) {
      console.error(err);
      spinner.style.display = 'none';
      overlayText.style.display = 'none';
      errorMessage.style.display = 'block';
      errorMessage.textContent = 'Lỗi tải Graph: ' + err.message;
    }
  });
</script>

</body>
</html>
